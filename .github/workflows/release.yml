name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_COLOR: 3

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # optipng: `build-sprites` shells out to it.
      # The rest are for `@maplibre/maplibre-gl-native`, which `Test (e2e)` renders through. It needs
      # two separate things on Linux, and each fails differently: without libopengl0/libegl1/libgles2
      # the module will not load at all (`libOpenGL.so.0: cannot open shared object file`), and with
      # them but no display it loads and then aborts mid-render (`Failed to open X display`, SIGABRT),
      # because its Linux backend draws through GLX rather than surfaceless EGL. Hence xvfb, and the
      # `xvfb-run` wrapper on the step below. CI needs none of this: its test job runs on macos-latest,
      # where the GL stack is part of the OS and there is no X server in the picture. This is the only
      # job that runs the native renderer on Linux.
      - name: Install system dependencies
        run: sudo apt-get install -y optipng libopengl0 libegl1 libgles2 xvfb

      - name: Checkout
        uses: actions/checkout@v7

      # The tag that triggered the run decides which release is written to — not `package.json`, which
      # this used to derive the tag from further down, after the whole build.
      #
      # The two can disagree: a tag pushed before the version bump lands, a bump landing without the
      # tag, or a `workflow_dispatch` from a branch, where there is no tag at all. The consequence was
      # silent and destructive rather than a no-op — `gh release upload --clobber` would overwrite the
      # assets of whatever *other* release `package.json` happened to name, and the `gh release edit
      # --latest` after it would then flip that release to "latest". A stale `package.json` on a
      # dispatch could republish an old release with new artifacts.
      #
      # Run before the build, not after it: a mismatch is knowable from the checkout alone, and there
      # is no reason to spend the build (and the e2e render) to find out.
      #
      # `github.*` goes through `env` rather than into the script body: a `${{ }}` expanded inside
      # `run:` is textual substitution, so a tag name is free to carry shell metacharacters.
      - name: Verify the tag matches package.json
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          VERSION="$(jq -r '.version' package.json)"
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::This workflow writes to the release named by the tag it runs on, so it has to run from one — got $REF_TYPE '$REF_NAME'. Re-run it against tag v$VERSION."
            exit 1
          fi
          if [ "$REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag '$REF_NAME' does not match package.json version '$VERSION'. Refusing to touch a release this commit does not describe."
            exit 1
          fi
          echo "Releasing $REF_NAME."
          echo "RELEASE_TAG=$REF_NAME" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      # No `xvfb-run`: the build renders nothing. It did for one release — `npm run doc` included the
      # screenshots, and v6.2.0 aborted here on `Failed to open X display`, after npm had already been
      # published. They are `npm run doc-site` now, which only the docs job below runs.
      - name: Build
        run: npm run build

      # `xvfb-run -a`: the native renderer needs an X display (see the install step above).
      - name: Test (e2e)
        run: xvfb-run -a npm run test:e2e

      - name: Tar sprites
        run: |
          cd release/sprites
          tar -cf - * | gzip -9 > ../sprites.tar.gz

      # Guards against shipping a sprite build that silently lost a sheet.
      #
      # The entry count is the real check, because it is what actually goes wrong: three sheets at two
      # ratios, each a .json + .png, plus index.json — 13 files. A size floor alone cannot tell "one
      # sheet is missing" from "the icons got smaller", which is why the old 1 MB floor failed v6.0.0
      # on a perfectly good build: v5 shipped 2 sheets at FOUR ratios (1.37 MB), v6 ships 3 sheets at
      # two (855 KB), because @3x/@4x are never fetched and the icons are SDF (see config/sprites.ts).
      # The size floor stays as a backstop for a sheet that is present but empty, well below the real
      # figure so that adding icons never trips it.
      - name: Verify sprites.tar.gz
        run: |
          SIZE=$(stat -c%s release/sprites.tar.gz)
          FILES=$(tar -tzf release/sprites.tar.gz | grep -c '\.\(json\|png\)$')
          echo "sprites.tar.gz: $SIZE bytes, $FILES files"
          if [ "$FILES" -ne 13 ]; then
            echo "ERROR: expected 13 sprite files, found $FILES"
            tar -tzf release/sprites.tar.gz
            exit 1
          fi
          if [ "$SIZE" -lt 524288 ]; then
            echo "ERROR: sprites.tar.gz is smaller than 512 KB ($SIZE bytes)"
            exit 1
          fi

      # `RELEASE_TAG` is set by the verify step at the top of this job, from the tag that triggered it.
      - name: Upload file to release
        run: gh release upload $RELEASE_TAG sprites.tar.gz styles.tar.gz versatiles-style.tar.gz --clobber
        working-directory: release

      - name: Update release
        run: gh release edit $RELEASE_TAG --draft=false --latest --prerelease=false

  # Publishes the package to npm — the step `npm run release` used to do on the maintainer's machine,
  # before anything here had run. It `needs` the job above, so a version reaches npm only after its
  # build, the unit and e2e tests and the release assets went through; v6.2.0 was on npm before this
  # workflow failed on it.
  #
  # A job of its own because it is the one with the right to publish: it gets no write access to the
  # repository, and it does not restore a cache that other runs have written (cache poisoning).
  publish:
    name: Publish to npm

    needs: release

    runs-on: ubuntu-latest

    permissions:
      contents: read
      # npm trusted publishing and provenance: no npm token is stored in this repository. The package
      # settings on npmjs.com name this workflow file as trusted publisher.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # npm 11.5.1 or newer is needed for trusted publishing
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # The tag was checked against package.json by the job above, so the version is read from there.
      # A version that is already on npm is skipped rather than failed on: npm refuses to publish a
      # version twice, and without this a re-run of the workflow — for a docs job that failed, say —
      # could never turn green. A release candidate ("6.4.0-rc.1") goes to the npm tag "next", so
      # "latest" stays the last release.
      #
      # `prepack` builds `dist/` (`npm run build-node`), which is all the tarball ships.
      - name: Publish
        run: |
          NAME="$(jq -r '.name' package.json)"
          VERSION="$(jq -r '.version' package.json)"
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already on npm, nothing to publish."
            exit 0
          fi
          case "$VERSION" in
            *-*) TAG=next ;;
            *) TAG=latest ;;
          esac
          npm publish --provenance --access public --tag "$TAG"

  docs:
    name: Build Documentation
    runs-on: macos-latest

    steps:
      - name: Install optipng
        run: brew install optipng

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The build writes the API pages into `docs/` (typedoc, as part of `npm run doc`).
      - name: Build
        run: npm run build

      # The screenshots and the sprite overview, which only this site shows. Kept out of `npm run build`
      # on purpose: the screenshots render from live tiles, and the release job above runs the build
      # after npm has been published — when they were part of it, v6.2.0 reached npm and then failed
      # here, before its assets were uploaded.
      - name: Generate screenshots and sprite overview
        run: npm run doc-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'

  deploy:
    name: Deploy Documentation

    needs: docs

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

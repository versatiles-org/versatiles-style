name: Pages

# Builds the documentation site and deploys it to GitHub Pages.
#
# `release.yml` calls this after a release. Running it by hand redeploys the site from the chosen
# branch, for a docs-only change (a TypeDoc option, the sprite overview) that should not wait for the
# next release. The API pages are generated from that branch's source, so dispatch it only while that
# source has the same public API as the latest release.
on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_COLOR: 3

jobs:
  docs:
    name: Build Documentation

    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Install optipng
        run: brew install optipng

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The build writes the API pages into `docs/` (typedoc, as part of `npm run doc`).
      - name: Build
        run: npm run build

      # The screenshots and the sprite overview, which only this site shows. Kept out of `npm run build`
      # on purpose: the screenshots render from live tiles, and the release job runs the build after
      # npm has been published — when they were part of it, v6.2.0 reached npm and then failed here,
      # before its assets were uploaded.
      - name: Generate screenshots and sprite overview
        run: npm run doc-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'

  deploy:
    name: Deploy Documentation

    needs: docs

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
